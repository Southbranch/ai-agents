name: Finance POC

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8,20 * * *'

permissions:
  contents: read

jobs:
  finance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MCP_ENDPOINT: ${{ vars.MCP_ENDPOINT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Run Finance POC
        run: php agents/finance/run.php