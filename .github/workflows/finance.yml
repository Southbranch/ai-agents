name: Finance POC

on:
  workflow_dispatch:
  schedule:
    - cron: '7 17 * * *'
      timezone: 'Europe/Stockholm'

permissions:
  contents: read

jobs:
  finance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MCP_ENDPOINT: https://adduco.se/finance/finance-mcp.php

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl

      - name: Run Finance POC
        run: php agents/finance/run.php