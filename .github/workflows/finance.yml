name: Finance POC

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
      timezone: 'Europe/Stockholm'

permissions:
  contents: read

jobs:
  finance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MCP_ENDPOINT: https://adduco.se/finance/finance-mcp.php

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Print schedule diagnostics
        run: |
          echo "event=${{ github.event_name }}"
          echo "sha=${{ github.sha }}"
          echo "ref=${{ github.ref }}"
          echo "schedule=${{ github.event.schedule }}"
          date -u

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Run Finance POC
        run: php agents/finance/run.php