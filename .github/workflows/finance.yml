name: Finance POC

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '30 16 * * *'
      timezone: 'Europe/Stockholm'

permissions:
  contents: read

jobs:
  finance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MCP_ENDPOINT: https://adduco.se/finance/finance-mcp.php

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Check MCP endpoint
        run: |
          curl --fail-with-body --silent --show-error --max-time 20 \
            -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"get_server_info","arguments":{}}}' \
            "$MCP_ENDPOINT"

      - name: Run Finance POC
        run: php agents/finance/run.php