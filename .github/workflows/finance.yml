name: Finance POC

# touched to re-register schedule triggers after run history was cleared
on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'
    - cron: '15 16 * * *'
    - cron: '30 16 * * *'
    - cron: '45 16 * * *'

permissions:
  contents: read
  issues: write

jobs:
  finance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MCP_ENDPOINT: https://adduco.se/finance/finance-mcp.php

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl

      - name: Run Finance POC
        id: finance
        run: php agents/finance/run.php | tee result.txt

      - name: Create issue with result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('result.txt') ? fs.readFileSync('result.txt', 'utf8') : 'No output captured.';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Finance POC #${context.runNumber} – ${new Date().toISOString()}`,
              body: '```\n' + body + '\n```',
              assignees: [context.repo.owner]
            });